
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অনলাইন ভর্তি আবেদন | Knowledge Garden</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:#f0f6f2;
    font-family:Arial,sans-serif;
    color:#222;
}

.form-box{
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 15px #0001;
}

h2{text-align:center;color:#075e3b}
p{text-align:center;color:#666}

label{
    display:block;
    margin-top:16px;
    font-weight:bold;
}

input,textarea,select{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

textarea{min-height:85px}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    background:#075e3b;
    color:white;
    border:0;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin-top:15px;
}

#successBox{
    display:none;
    margin-top:22px;
    padding:20px;
    background:#eaf7ee;
    border:1px solid #a8d8b5;
    border-radius:10px;
}

#successBox h3{
    color:#075e3b;
    text-align:center;
}

.info{
    background:white;
    padding:12px;
    border-radius:7px;
    margin:10px 0;
    overflow-wrap:anywhere;
}

.application-id{
    font-size:19px;
    font-weight:bold;
    color:#075e3b;
    text-align:center;
}

.status-link{
    display:block;
    text-align:center;
    background:#075e3b;
    color:white;
    padding:13px;
    border-radius:8px;
    text-decoration:none;
    margin-top:15px;
}

.copy-btn{
    background:#2877b9;
    margin-top:10px;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#075e3b;
}
</style>
</head>

<body>

<div class="form-box">

<h2>Knowledge Garden Islamic Institute</h2>
<p>অনলাইন ভর্তি আবেদন ফর্ম</p>

<form id="admissionForm">

<label>শিক্ষার্থীর নাম</label>
<input name="studentName" required maxlength="100">

<label>পিতার নাম</label>
<input name="fatherName" required maxlength="100">

<label>মাতার নাম</label>
<input name="motherName" required maxlength="100">

<label>মোবাইল নম্বর</label>
<input name="phone" type="tel" required maxlength="20">

<label>যে শ্রেণিতে ভর্তি হতে চান</label>
<select name="className" required>
<option value="">শ্রেণি নির্বাচন করুন</option>
<option>প্রথম শ্রেণি</option>
<option>দ্বিতীয় শ্রেণি</option>
<option>তৃতীয় শ্রেণি</option>
<option>চতুর্থ শ্রেণি</option>
<option>পঞ্চম শ্রেণি</option>
<option>ষষ্ঠ শ্রেণি</option>
<option>সপ্তম শ্রেণি</option>
<option>অষ্টম শ্রেণি</option>
<option>নবম শ্রেণি</option>
<option>অন্যান্য</option>
</select>

<label>সম্পূর্ণ ঠিকানা</label>
<textarea name="address" required maxlength="500"></textarea>

<button type="submit" id="submitBtn">
আবেদন জমা দিন
</button>

<p id="message" role="status"></p>

</form>

<div id="successBox">

<h3>অভিনন্দন! আবেদন সফল হয়েছে।</h3>

<p>আপনার আবেদনটি গ্রহণ করা হয়েছে। নিচের তথ্যগুলো সংরক্ষণ করুন।</p>

<div class="info">
<strong>Application ID:</strong>
<div class="application-id" id="applicationId"></div>
</div>

<button type="button" class="copy-btn" id="copyBtn">
আবেদন নম্বর কপি করুন
</button>

<div class="info">
<strong>আবেদনের তারিখ:</strong>
<div id="applicationDate"></div>
</div>

<div class="info">
<strong>আবেদনের অবস্থা:</strong>
<div>অপেক্ষমাণ (Pending)</div>
</div>

<a class="status-link"
href="https://knowledgegardenbd.github.io/knowledge-garden/status.html">
আবেদনের অবস্থা যাচাই করুন
</a>

</div>

<a class="back-link" href="index.html">হোম পেজে ফিরে যান</a>

</div>

<script>
const API_URL = "https://knowledge-garden-3.onrender.com";

const form = document.getElementById("admissionForm");
const btn = document.getElementById("submitBtn");
const msg = document.getElementById("message");
const successBox = document.getElementById("successBox");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "আবেদন জমা হচ্ছে...";
    msg.textContent = "";
    successBox.style.display = "none";

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    try {

        const response = await fetch(API_URL + "/api/admissions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "আবেদন জমা হয়নি।");
        }

        if (!result.applicationId) {
            throw new Error("আবেদন জমা হয়েছে, কিন্তু Application ID পাওয়া যায়নি। কর্তৃপক্ষের সঙ্গে যোগাযোগ করুন।");
        }

        document.getElementById("applicationId").textContent =
            result.applicationId;

        const dateValue = result.applicationDate || result.createdAt;

        document.getElementById("applicationDate").textContent =
            dateValue
            ? new Date(dateValue).toLocaleString("bn-BD")
            : "তারিখ পাওয়া যায়নি";

        form.style.display = "none";
        successBox.style.display = "block";

        msg.style.color = "green";
        msg.textContent = "আবেদন সফলভাবে জমা হয়েছে।";

    } catch(error) {

        msg.style.color = "red";
        msg.textContent = error.message;

    } finally {

        btn.disabled = false;
        btn.textContent = "আবেদন জমা দিন";

    }

});

document.getElementById("copyBtn").addEventListener("click", async function(){

    const id = document.getElementById("applicationId").textContent;

    try {
        await navigator.clipboard.writeText(id);
        this.textContent = "কপি হয়েছে!";
    } catch(error) {
        this.textContent = "নম্বরটি হাতে কপি করুন: " + id;
    }

});
</script>

</body>
</html>
