
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Knowledge Garden</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#064d32,#0b7650);
}
.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 35px #002b1b55;
}
h2 { color: #075e3b; text-align: center; }
p { text-align: center; color: #666; }
label { display: block; margin-top: 18px; }
input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 24px;
    background: #075e3b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:disabled { opacity: .6; }
#message { color: #c62828; margin-top: 15px; }
</style>
</head>
<body>

<div class="login-box">
    <h2>Knowledge Garden</h2>
    <p>Admin Dashboard Login</p>

    <form id="loginForm">
        <label>Admin Email</label>
        <input type="email" id="email"
        placeholder="আপনার Admin Email" required>

        <label>Password</label>
        <input type="password" id="password"
        placeholder="আপনার Password" required>

        <button type="submit" id="loginButton">
            Login
        </button>
        <p id="message"></p>
    </form>
</div>

<script>
const API_URL = "https://knowledge-garden-3.onrender.com";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    button.disabled = true;
    button.textContent = "Please wait...";
    message.textContent = "";

    try {
        const response = await fetch(API_URL + "/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed");
        }

        sessionStorage.setItem("adminToken", data.token);
        window.location.href = "admin-dashboard.html";

    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>

</body>
</html>
