
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Knowledge Garden</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f2;
    color:#24352c;
}

header{
    background:#075e3b;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

header h2{margin:0;font-size:19px}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-size:14px;
}

button:disabled{opacity:.5;cursor:not-allowed}

.logout{background:white;color:#075e3b}

main{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.welcome,.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:18px;
    box-shadow:0 2px 8px #0000000d;
}

h3{color:#075e3b}

#status{color:#16834d}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:17px;
    border-radius:10px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:25px;
    color:#075e3b;
    margin-top:8px;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
    margin:18px 0;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.load-btn{background:#075e3b;color:white}

.admission-card{
    border:1px solid #ddd;
    padding:16px;
    margin-top:14px;
    border-radius:9px;
    background:#fff;
}

.admission-card h3{margin-top:0}

.detail{
    margin:8px 0;
    line-height:1.6;
    overflow-wrap:anywhere;
}

.app-id{
    font-weight:bold;
    color:#075e3b;
}

.copy-btn{background:#e8f1eb;color:#075e3b}
.approve-btn{background:#087a42;color:white}
.reject-btn{background:#c62828;color:white}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:13px;
}

.status-badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:15px;
    font-size:13px;
    background:#eee;
}

.pending{background:#fff3cd;color:#856404}
.approved{background:#d4edda;color:#155724}
.rejected{background:#f8d7da;color:#721c24}

#resultCount{color:#666}

@media(max-width:500px){
    main{padding:12px}
    .filters{grid-template-columns:1fr}
    header h2{font-size:16px}
}
</style>
</head>

<body>

<header>
    <h2>Knowledge Garden Admin</h2>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<section class="welcome">
    <h2>স্বাগতম, Administrator!</h2>
    <p>Knowledge Garden Islamic Institute Admin Dashboard</p>
    <p id="status">Admin পরিচয় যাচাই করা হচ্ছে...</p>
</section>

<section class="stats">
    <div class="stat">মোট আবেদন<strong id="totalCount">0</strong></div>
    <div class="stat">অপেক্ষমাণ<strong id="pendingCount">0</strong></div>
    <div class="stat">অনুমোদিত<strong id="approvedCount">0</strong></div>
    <div class="stat">বাতিল<strong id="rejectedCount">0</strong></div>
</section>

<section class="card">

<h3>ভর্তি আবেদনসমূহ</h3>

<div class="filters">

<input
    type="search"
    id="searchInput"
    placeholder="Application ID অথবা শিক্ষার্থীর নাম লিখুন"
>

<select id="statusFilter">
    <option value="">সব আবেদন</option>
    <option value="Pending">অপেক্ষমাণ</option>
    <option value="Approved">অনুমোদিত</option>
    <option value="Rejected">বাতিল</option>
</select>

</div>

<button class="load-btn" onclick="loadAdmissions()">
আবেদনগুলো রিফ্রেশ করুন
</button>

<p id="resultCount"></p>

<div id="admissionList">
    আবেদন লোড করার জন্য অপেক্ষা করুন।
</div>

</section>

</main>

<script>
const API_URL = "https://knowledge-garden-3.onrender.com";
const token = sessionStorage.getItem("adminToken");

let allApplications = [];

const statusElement = document.getElementById("status");
const list = document.getElementById("admissionList");

async function verifyAdmin(){

    if(!token){
        window.location.replace("admin.html");
        return;
    }

    try{

        const response = await fetch(API_URL + "/api/admin/me",{
            headers:{"Authorization":"Bearer "+token}
        });

        if(!response.ok){
            sessionStorage.removeItem("adminToken");
            window.location.replace("admin.html");
            return;
        }

        statusElement.textContent =
            "Admin পরিচয় সফলভাবে যাচাই হয়েছে।";

        await loadAdmissions();

    }catch(error){

        statusElement.textContent =
            "সার্ভারের সঙ্গে সংযোগ হচ্ছে না।";
    }
}

function logout(){

    sessionStorage.removeItem("adminToken");
    window.location.replace("admin.html");
}

async function loadAdmissions(){

    list.textContent = "আবেদন লোড হচ্ছে...";

    try{

        const response = await fetch(API_URL + "/api/admissions",{
            headers:{"Authorization":"Bearer "+token}
        });

        const result = await response.json();

        if(!response.ok){
            throw new Error(result.message || "আবেদন লোড হয়নি");
        }

        allApplications = result.applications || [];

        updateStatistics();
        filterAdmissions();

    }catch(error){

        list.textContent = error.message;
    }
}

function updateStatistics(){

    document.getElementById("totalCount").textContent =
        allApplications.length;

    document.getElementById("pendingCount").textContent =
        allApplications.filter(a=>a.status==="Pending").length;

    document.getElementById("approvedCount").textContent =
        allApplications.filter(a=>a.status==="Approved").length;

    document.getElementById("rejectedCount").textContent =
        allApplications.filter(a=>a.status==="Rejected").length;
}

function filterAdmissions(){

    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const status = document.getElementById("statusFilter").value;

    const filtered = allApplications.filter(item=>{

        const matchesSearch =
            (item.applicationId || "").toLowerCase().includes(search) ||
            (item.studentName || "").toLowerCase().includes(search);

        const matchesStatus =
            !status || item.status===status;

        return matchesSearch && matchesStatus;
    });

    renderAdmissions(filtered);
}

function renderAdmissions(applications){

    list.replaceChildren();

    document.getElementById("resultCount").textContent =
        "মোট " + applications.length + "টি আবেদন পাওয়া গেছে।";

    if(applications.length===0){
        list.textContent = "কোনো আবেদন পাওয়া যায়নি।";
        return;
    }

    applications.forEach(item=>{

        const card = document.createElement("div");
        card.className = "admission-card";

        const title = document.createElement("h3");
        title.textContent = item.studentName || "নাম নেই";

        const id = document.createElement("p");
        id.className = "detail app-id";
        id.textContent = "Application ID: " +
            (item.applicationId || "নেই");

        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "ID কপি করুন";

        copyBtn.onclick = async ()=>{
            try{
                await navigator.clipboard.writeText(
                    item.applicationId || ""
                );
                copyBtn.textContent = "কপি হয়েছে!";
            }catch(error){
                alert("Application ID: " + (item.applicationId || "নেই"));
            }
        };

        const date = document.createElement("p");
        date.className = "detail";

        date.textContent = "আবেদনের তারিখ: " +
            (item.createdAt
                ? new Date(item.createdAt).toLocaleString("bn-BD")
                : "পাওয়া যায়নি");

        const details = document.createElement("p");
        details.className = "detail";

        details.textContent =
            "পিতা: " + (item.fatherName || "") +
            " | মাতা: " + (item.motherName || "") +
            " | মোবাইল: " + (item.phone || "") +
            " | শ্রেণি: " + (item.className || "") +
            " | ঠিকানা: " + (item.address || "");

        const badge = document.createElement("span");
        badge.className = "status-badge " +
            (item.status==="Approved" ? "approved" :
             item.status==="Rejected" ? "rejected" : "pending");

        badge.textContent =
            item.status==="Approved" ? "অনুমোদিত" :
            item.status==="Rejected" ? "বাতিল" : "অপেক্ষমাণ";

        const actions = document.createElement("div");
        actions.className = "actions";

        const approveBtn = document.createElement("button");
        approveBtn.className = "approve-btn";
        approveBtn.textContent = "Approve";
        approveBtn.disabled = item.status==="Approved";
        approveBtn.onclick = ()=>{
            updateAdmissionStatus(item._id,"Approved");
        };

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "reject-btn";
        rejectBtn.textContent = "Reject";
        rejectBtn.disabled = item.status==="Rejected";
        rejectBtn.onclick = ()=>{
            updateAdmissionStatus(item._id,"Rejected");
        };

        actions.append(approveBtn,rejectBtn);

        card.append(
            title,id,copyBtn,date,details,badge,actions
        );

        list.appendChild(card);
    });
}

async function updateAdmissionStatus(id,status){

    if(!confirm("আপনি কি আবেদনটির Status "+status+" করতে চান?")){
        return;
    }

    try{

        const response = await fetch(
            API_URL + "/api/admissions/" + id + "/status",
            {
                method:"PATCH",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer "+token
                },
                body:JSON.stringify({status})
            }
        );

        const result = await response.json();

        if(!response.ok){
            throw new Error(result.message || "Status পরিবর্তন হয়নি");
        }

        alert("আবেদনের Status সফলভাবে পরিবর্তন হয়েছে।");

        await loadAdmissions();

    }catch(error){

        alert(error.message);
    }
}

document.getElementById("searchInput")
    .addEventListener("input",filterAdmissions);

document.getElementById("statusFilter")
    .addEventListener("change",filterAdmissions);

verifyAdmin();

</script>

</body>
</html>
