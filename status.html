
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভর্তি আবেদনের অবস্থা | Knowledge Garden</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f2;
    color: #24352c;
}

header {
    background: #075e3b;
    color: white;
    padding: 20px;
    text-align: center;
}

header h2 {
    margin: 0;
}

main {
    max-width: 600px;
    margin: 35px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000012;
}

h3 {
    color: #075e3b;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin: 12px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 7px;
    background: #075e3b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#result {
    margin-top: 20px;
}

.result-card {
    border: 1px solid #ddd;
    padding: 18px;
    border-radius: 9px;
    line-height: 1.8;
}

.pending {
    color: #a66b00;
    font-weight: bold;
}

.approved {
    color: #087a42;
    font-weight: bold;
}

.rejected {
    color: #c62828;
    font-weight: bold;
}

.error {
    color: #c62828;
}

a {
    color: #075e3b;
}

footer {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h2>Knowledge Garden Islamic Institute</h2>
    <p>ভর্তি আবেদনের অবস্থা যাচাই</p>
</header>

<main>
    <section class="card">

        <h3>আপনার আবেদন যাচাই করুন</h3>

        <p>আপনার Application ID লিখুন।</p>

        <input
            type="text"
            id="applicationId"
            placeholder="যেমন: KG-2026-XXXXXXXXXX"
            autocomplete="off"
        >

        <button id="checkButton" onclick="checkStatus()">
            আবেদনের অবস্থা দেখুন
        </button>

        <div id="result" aria-live="polite"></div>

    </section>
</main>

<footer>
    <a href="index.html">হোম পেজে ফিরে যান</a>
    <p>© Knowledge Garden Islamic Institute</p>
</footer>

<script>

const API_URL = "https://knowledge-garden-3.onrender.com";

async function checkStatus() {

    const input = document.getElementById("applicationId");
    const result = document.getElementById("result");
    const button = document.getElementById("checkButton");

    const applicationId = input.value.trim().toUpperCase();

    if (!applicationId) {
        result.innerHTML =
            '<p class="error">অনুগ্রহ করে Application ID লিখুন।</p>';
        return;
    }

    button.disabled = true;
    button.textContent = "তথ্য খোঁজা হচ্ছে...";
    result.textContent = "";

    try {

        const response = await fetch(
            API_URL + "/api/admissions/status/" +
            encodeURIComponent(applicationId)
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "আবেদন পাওয়া যায়নি।");
        }

        const application = data.application;

        let statusText = "";
        let statusClass = "";

        if (application.status === "Pending") {
            statusText = "অপেক্ষমাণ";
            statusClass = "pending";
        } else if (application.status === "Approved") {
            statusText = "অনুমোদিত";
            statusClass = "approved";
        } else {
            statusText = "বাতিল";
            statusClass = "rejected";
        }

        const date = new Date(application.applicationDate);

        const formattedDate = date.toLocaleString("bn-BD", {
            dateStyle: "long",
            timeStyle: "short"
        });

        const card = document.createElement("div");
        card.className = "result-card";

        const heading = document.createElement("h3");
        heading.textContent = "আবেদনের তথ্য";

        const fields = [
            ["Application ID", application.applicationId],
            ["শিক্ষার্থীর নাম", application.studentName],
            ["শ্রেণি", application.className],
            ["আবেদনের তারিখ", formattedDate]
        ];

        card.appendChild(heading);

        fields.forEach(([label, value]) => {
            const p = document.createElement("p");
            p.textContent = label + ": " + value;
            card.appendChild(p);
        });

        const status = document.createElement("p");
        status.textContent = "বর্তমান অবস্থা: " + statusText;
        status.className = statusClass;

        card.appendChild(status);

        result.replaceChildren(card);

    } catch (error) {

        const message = document.createElement("p");
        message.className = "error";
        message.textContent = error.message;

        result.replaceChildren(message);

    } finally {

        button.disabled = false;
        button.textContent = "আবেদনের অবস্থা দেখুন";
    }
}

</script>

</body>
          </html>
